// ================= 终点 POI 加载函数 =================
async function loadEndPOIByStart() {
    const startVal = document.getElementById('navStart').value;
    const endCat = document.getElementById('navEndCat').value;
    const endSelect = document.getElementById('navEnd');

    endSelect.innerHTML = '';
    navPOIData = [];

    if (!startVal || !endCat) return;

    const [lng, lat] = startVal.split(',').map(Number);

    const res = await fetch(`data/${endCat}.json`);
    const data = await res.json();

    navPOIData = data.features.filter(f => {
        const [plng, plat] = f.geometry.coordinates;
        return Math.hypot(plng - lng, plat - lat) < 0.06;
    }).slice(0, 50);

    navPOIData.forEach(f => {
        const opt = document.createElement('option');
        opt.value = f.geometry.coordinates.join(',');
        opt.text = f.properties.店名 || f.properties.名称 || '未知地点';
        endSelect.appendChild(opt);
    });
}


        async function handleMapSearch() {
            const cat = document.getElementById('mapCat').value;
            const dist = document.getElementById('mapDist').value;
            const kw = document.getElementById('mapKw').value;
            const info = document.getElementById('mapInfo');
            const list = document.getElementById('mapResultsList');

            info.innerText = "正在检索海量数据...";
            list.innerHTML = "";
            mapMarkers.forEach(m => m.remove());

            try {
                const res = await fetch(`data/${cat}.json`);
                const data = await res.json();
                const matches = data.features.filter(f => {
                    const p = f.properties;
                    const nameMatch = (p.店名 || p.名称 || "").includes(kw);
                    const addrMatch = (p.地址 || "").includes(dist);
                    return nameMatch && addrMatch;
                }).slice(0, 100); // 搜索最多展示100个点，保证流畅




                matches.forEach(f => {
                    const m = new mapboxgl.Marker({ color: 'red' })
                        .setLngLat(f.geometry.coordinates)
                        .setPopup(new mapboxgl.Popup().setHTML(`<b>${f.properties.店名 || f.properties.名称}</b><br>${f.properties.地址 || ''}`))
                        .addTo(map);
                    mapMarkers.push(m);

                    const item = document.createElement('div');
                    item.style.padding = "10px";
                    item.style.borderBottom = "1px solid #eee";
                    item.style.cursor = "pointer";
                    item.innerHTML = `<b>${f.properties.店名 || f.properties.名称}</b><br><small>${f.properties.地址 || '地址不详'}</small>`;
                    item.onclick = () => map.flyTo({ center: f.geometry.coordinates, zoom: 15 });
                    list.appendChild(item);
                });
                info.innerText = `找到相关结果 ${matches.length} 个`;
            } catch (e) { info.innerText = "数据读取失败，请检查文件。"; }
        }

      // 先在函数外面定义这两个变量
let allTableFeatures = []; 
let currentTablePage = 1;
const rowsPerPage = 15;

async function loadTableData() {
    const cat = document.getElementById('tblCat').value;
    const tbody = document.getElementById('statsTbody');
    const status = document.getElementById('tblStatus');

    tbody.innerHTML = "<tr><td colspan='4' style='text-align:center; padding:50px;'>读取数据中...</td></tr>";

    try {
        // 关键修复：这里改为 .json
        const res = await fetch(`data/${cat}.json`); 
        const data = await res.json();
        
        allTableFeatures = data.features; 
        currentTablePage = 1; 
        status.innerText = `该数据集共有 ${allTableFeatures.length.toLocaleString()} 条记录`;
        
        renderTableByPage(); // 去执行渲染
    } catch (e) { 
        tbody.innerHTML = "<tr><td colspan='4' style='text-align:center; color:red;'>加载失败，请确认 data 文件夹下有 " + cat + ".json</td></tr>"; 
    }
}

        // --- 新增函数：渲染表格 (直接粘贴在 loadTableData 下面) ---
        function renderTableByPage() {
            const tbody = document.getElementById('statsTbody');
            const pageInfo = document.getElementById('pageInfo');
            const cat = document.getElementById('tblCat').value;

            // 计算当前页的数据范围
            const start = (currentTablePage - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const pageItems = allTableFeatures.slice(start, end);
            const totalPages = Math.ceil(allTableFeatures.length / rowsPerPage) || 1;

            // 构造 HTML 内容
            tbody.innerHTML = pageItems.map(f => `
                <tr>
                    <td><strong>${f.properties.店名 || f.properties.名称 || '未知'}</strong></td>
                    <td>${f.properties.地址 || '广州市'}</td>
                    <td><span style="background:#e6f7ff; color:#1890ff; padding:2px 8px; border-radius:4px;">${cat}</span></td>
                    <td><small>${f.geometry.coordinates[0].toFixed(3)}, ${f.geometry.coordinates[1].toFixed(3)}</small></td>
                </tr>
            `).join('');

            // 更新页码信息显示
            if(pageInfo) pageInfo.innerText = `第 ${currentTablePage} / ${totalPages} 页`;
            
            // 按钮状态控制
            const pBtn = document.getElementById('prevBtn');
            const nBtn = document.getElementById('nextBtn');
            if(pBtn && nBtn) {
                pBtn.disabled = (currentTablePage === 1);
                nBtn.disabled = (currentTablePage === totalPages);
                pBtn.style.opacity = (currentTablePage === 1) ? 0.5 : 1;
                nBtn.style.opacity = (currentTablePage === totalPages) ? 0.5 : 1;
            }
        }

        // --- 新增函数：翻页动作 (直接粘贴在最下面) ---
        function changePage(step) {
            currentTablePage += step;
            renderTableByPage();
            // 翻页后让数据明细页面的滚动条回到顶部
            document.getElementById('stats-page').scrollTop = 0;
        }

  // 5. 极简强力渲染版 - 彻底避免边界计算报错
map.on('load', () => {
    fetch('data/广州市区界线.json')
        .then(r => r.json())
        .then(geojson => {
            // 简单物理互换经纬度，不再进行 bounds 计算
            geojson.features.forEach(f => {
                const fix = (coords) => {
                    if (typeof coords[0] === 'number') {
                        // 如果第二位坐标明显是经度(>90)，则互换
                        if (Math.abs(coords[1]) > 90) {
                            [coords[0], coords[1]] = [coords[1], coords[0]];
                        }
                    } else {
                        coords.forEach(fix);
                    }
                };
                fix(f.geometry.coordinates);
            });

            // 直接添加数据源和图层，不使用 map.fitBounds()
            map.addSource('gz-boundary-final', {
                'type': 'geojson',
                'data': geojson
            });

           map.addLayer({
    'id': 'gz-line-final',
    'type': 'line',
    'source': 'gz-boundary-final',
    'layout': {
        'line-join': 'round', // 转角圆润，不会出现尖刺
        'line-cap': 'round'
    },
    'paint': {
        'line-color': 'green', // 使用绿色，更加醒目
        'line-width': 3,        // 稍微调细一点，增加精致感
        'line-opacity': 0.9      // 保持高透明度，确保清晰
    }
});
            console.log("已发送极简渲染指令，请手动查看广州区域");
        })
        .catch(e => console.error("加载失败:", e));
});
// 负责画出表格内容的函数
function renderTableByPage() {
    const tbody = document.getElementById('statsTbody');
    const pageInput = document.getElementById('pageInput');
    const pageTotal = document.getElementById('pageTotal');
    const cat = document.getElementById('tblCat').value;

    const start = (currentTablePage - 1) * rowsPerPage;
    const end = start + rowsPerPage;
    const pageItems = allTableFeatures.slice(start, end);
    const totalPages = Math.ceil(allTableFeatures.length / rowsPerPage) || 1;

    // 更新表格行
    tbody.innerHTML = pageItems.map(f => `
        <tr>
            <td><strong>${f.properties.店名 || f.properties.名称 || '未知'}</strong></td>
            <td>${f.properties.地址 || '广州市'}</td>
            <td><span style="background:#e6f7ff; color:#1890ff; padding:2px 8px; border-radius:4px;">${cat}</span></td>
            <td><small>${f.geometry.coordinates[0].toFixed(3)}, ${f.geometry.coordinates[1].toFixed(3)}</small></td>
        </tr>
    `).join('');

    // 更新页码输入框和总页数显示
    if(pageInput) pageInput.value = currentTablePage;
    if(pageTotal) pageTotal.innerText = `/ ${totalPages} 页`;
    
    // 按钮禁用逻辑
    document.getElementById('prevBtn').disabled = (currentTablePage === 1);
    document.getElementById('nextBtn').disabled = (currentTablePage === totalPages);
}

// 翻页函数
function changePage(step) {
    currentTablePage += step;
    renderTableByPage();
    document.getElementById('stats-page').scrollTop = 0;
}

// 跳页函数：按回车键触发
function jumpToPage() {
    const input = document.getElementById('pageInput');
    const totalPages = Math.ceil(allTableFeatures.length / rowsPerPage) || 1;
    let target = parseInt(input.value);

    if (isNaN(target) || target < 1) target = 1;
    if (target > totalPages) target = totalPages;

    currentTablePage = target;
    renderTableByPage();
    document.getElementById('stats-page').scrollTop = 0;
}
async function drawRoute() {
    const startVal = document.getElementById('navStart').value;
    const endVal = document.getElementById('navEnd').value;
    const startLngLat = startVal.split(',').map(Number);
const endLngLat = endVal.split(',').map(Number);

    const infoBox = document.getElementById('navInfo');

    if (!startVal || !endVal) {
        alert('请先选择起点和终点');
        return;
    }

    infoBox.innerText = '正在计算最优路线...';

    const url = `https://api.mapbox.com/directions/v5/mapbox/${navMode}/${startVal};${endVal}?geometries=geojson&access_token=${mapboxgl.accessToken}`;
    const res = await fetch(url);
    const data = await res.json();

    if (!data.routes || !data.routes.length) {
        infoBox.innerText = '未找到路线';
        return;
    }

    const route = data.routes[0];

    if (map.getSource(navRouteSourceId)) {
        map.removeLayer(navRouteLayerId);
        map.removeSource(navRouteSourceId);
    }

    map.addSource(navRouteSourceId, {
        type: 'geojson',
        data: { type: 'Feature', geometry: route.geometry }
    });

    map.addLayer({
        id: navRouteLayerId,
        type: 'line',
        source: navRouteSourceId,
        paint: {
            'line-color': navMode === 'walking' ? '#1890ff' :
                          navMode === 'cycling' ? '#fa8c16' : '#f5222d',
            'line-width': 5
        }
    });

    // ================= 标注起点 =================
if (navStartMarker) navStartMarker.remove();

 navStartMarker = new mapboxgl.Marker({ color: 'green' })
    .setLngLat(startLngLat)
    .setPopup(new mapboxgl.Popup().setText('起点'))
    .addTo(map);

// ================= 标注终点 =================
 if (navEndMarker) navEndMarker.remove();

 navEndMarker = new mapboxgl.Marker({ color: 'red' })
    .setLngLat(endLngLat)
    .setPopup(new mapboxgl.Popup().setText('终点'))
    .addTo(map);


    infoBox.innerHTML = `
        📏 ${(route.distance / 1000).toFixed(2)} km<br>
        ⏱️ ${Math.round(route.duration / 60)} 分钟
    `;

    map.fitBounds(route.geometry.coordinates, { padding: 60 });
}
